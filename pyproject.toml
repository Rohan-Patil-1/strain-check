[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strain-check"
version = "0.1.0"
description = "Ergonomic risk assessment from phone video"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
video = ["mediapipe>=0.10", "numpy>=1.24", "opencv-python>=4.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
